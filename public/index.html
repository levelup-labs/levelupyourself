<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E151E">
<title>LevelUpYourself</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
/* LEVEL UP YOURSELF · design system
   Layout: one mobile column (max 560px). Today = dashboard, Character = RPG profile, Goals, Profile. Sticky character bar on Today.
   Single deliberate dark world: deep navy base, violet = growth, blue = focus, emerald = done, gold = rare wins. */
:root{
  --bg:#0E151E; --bg-2:#111923; --surface:#161F2B; --surface-2:#1C2634; --surface-3:#243042;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.13);
  --fg:#F3F5FB; --muted:#9BA4C0; --dim:#636D8C;
  --violet:#E414A8; --violet-2:#FF4FC4; --blue:#0AA6FA; --emerald:#0AA6FA; --gold:#FEC11F; --danger:#FF5C7A;
  --grad:linear-gradient(90deg,#0AA6FA 0%,#E414A8 55%,#FA6021 100%); --grad-btn:linear-gradient(120deg,#E414A8 0%,#FA6021 100%); --blue:#0AA6FA; --magenta:#E414A8; --orange:#FA6021;
  --grad-gold:linear-gradient(135deg,#FFD866 0%,#FEC11F 40%,#FA6021 100%);
  --c-geist:#0AA6FA; --c-koerper:#FA6021; --c-disziplin:#E414A8; --c-kreativ:#FEC11F; --c-sozial:#A64BE8; --c-special:#5CE1FF;
  --font:'Archivo','Helvetica Neue',Arial,sans-serif;
  --r-xl:28px; --r-lg:22px; --r-md:16px; --r-sm:12px;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 18px 40px -18px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%;overscroll-behavior-y:contain}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(60% 40% at -10% -5%,rgba(10,166,250,.10),transparent 60%),radial-gradient(50% 35% at 110% 0%,rgba(228,20,168,.09),transparent 60%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--violet-2);outline-offset:3px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 180px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
p{margin:0}
h1,h2,h3{margin:0;line-height:1;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:2.5rem;font-weight:800;font-stretch:78%}
h2{font-size:1.5rem;font-weight:780;font-stretch:84%}
h3{font-size:1.08rem;font-weight:680;line-height:1.2;letter-spacing:0}
.num{font-weight:800;font-stretch:72%;font-variant-numeric:tabular-nums;line-height:.9;letter-spacing:-.01em}
.tnum{font-variant-numeric:tabular-nums}
.lbl{font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 20px;font-weight:700;font-size:.95rem;letter-spacing:.01em;line-height:1;
  background:var(--surface-2);color:var(--fg);transition:transform .15s, background .2s, box-shadow .25s}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 10px 26px -10px rgba(228,20,168,.75)}
.btn.primary:hover{box-shadow:0 12px 30px -8px rgba(228,20,168,.95)}
.btn.gold{background:var(--grad-gold);color:#2A1204;box-shadow:0 10px 26px -10px rgba(254,193,31,.7)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line-2)}
.btn.ghost:hover{background:rgba(255,255,255,.04)}
.btn.small{padding:9px 14px;font-size:.85rem}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.link{background:none;border:0;padding:0;color:var(--violet-2);font-weight:600}
.link:hover{color:#fff}
.icon-btn{background:none;border:0;color:var(--dim);padding:6px;border-radius:10px;line-height:0;transition:color .2s, background .2s}
.icon-btn:hover{color:var(--danger);background:rgba(255,92,122,.08)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* inputs */
label.f{display:flex;flex-direction:column;gap:7px;font-size:.8rem;font-weight:600;color:var(--muted)}
.inp{width:100%;background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:13px 14px;color:var(--fg);font-size:1rem;transition:border-color .2s, box-shadow .2s}
.inp:focus{border-color:var(--violet);outline:none;box-shadow:0 0 0 4px rgba(228,20,168,.18)}
textarea.inp{min-height:80px;resize:vertical}
.err{color:var(--danger);font-size:.9rem}
.seg{display:flex;background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:9px 8px;font-weight:650;font-size:.85rem;color:var(--muted);line-height:1;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--fg);box-shadow:0 2px 10px rgba(0,0,0,.35)}

/* attribute chips + icons */
.ai{width:1.05em;height:1.05em;flex:none;display:inline-block;vertical-align:-.16em;stroke:currentColor;fill:currentColor;fill-opacity:.2;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px 4px 7px;font-size:.74rem;font-weight:650;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);white-space:nowrap}
.chip .ai{width:1.2em;height:1.2em}
button.chip{border:1px solid transparent;padding:8px 13px 8px 10px;font-size:.85rem;opacity:.5;transition:opacity .2s, border-color .2s}
button.chip[aria-pressed="true"]{opacity:1;border-color:color-mix(in srgb,var(--c) 60%,transparent)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.66rem;font-weight:750;letter-spacing:.1em;text-transform:uppercase;color:var(--tc,var(--muted));line-height:1}
.tag svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tag.gold{--tc:var(--gold)}
.tag.violet{--tc:var(--violet-2)}
.tag.blue{--tc:#7FB0FF}
.pips{display:inline-flex;gap:2px;align-items:flex-end;vertical-align:middle}
.pips i{width:3px;border-radius:2px;background:var(--line-2)}
.pips i:nth-child(1){height:5px}.pips i:nth-child(2){height:7px}.pips i:nth-child(3){height:9px}.pips i:nth-child(4){height:11px}
.pips i.on{background:var(--violet-2)}
.xp{font-weight:800;font-stretch:75%;font-size:1.05rem;color:var(--fg);white-space:nowrap;font-variant-numeric:tabular-nums}
.xp small{font-size:.7rem;font-weight:700;color:var(--muted);margin-left:2px;font-stretch:100%}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:4px 2px 2px}
.sec-h > div{min-width:0;display:flex;flex-direction:column;gap:4px}
.sec-m{font-size:.82rem;color:var(--muted)}
.empty{text-align:center;padding:26px 18px;border:1px dashed var(--line-2);border-radius:var(--r-lg);color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center;font-size:.92rem}
.bar{height:6px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--c,var(--grad));transition:width .8s cubic-bezier(.2,.8,.2,1)}

/* ---------- Auth ---------- */
.auth{min-height:calc(100vh - 60px);display:flex;flex-direction:column;justify-content:center;gap:30px}
.brand{font-weight:900;font-stretch:66%;font-size:clamp(3.4rem,17vw,5rem);line-height:.82;letter-spacing:-.01em}
.brand span{display:block}
.auth-ring{width:84px;height:84px;border-radius:50%;background:conic-gradient(from 200deg,var(--violet),var(--blue),var(--emerald),var(--gold),var(--violet));
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Onboarding ---------- */
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--surface-2)}
.steps i.on{background:var(--grad)}
.q{display:flex;flex-direction:column;gap:12px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.q-top{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.q-ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.q-ic .ai{width:24px;height:24px}
.q-top b{font-size:2.2rem;color:var(--c)}
input[type=range]{width:100%;accent-color:var(--c);height:28px}
.scale{display:flex;justify-content:space-between;font-size:.75rem;color:var(--dim)}
.pick{display:flex;gap:12px;align-items:center;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);cursor:pointer;transition:border-color .2s, background .2s}
.pick:has(input:checked){border-color:color-mix(in srgb,var(--violet) 70%,transparent);background:color-mix(in srgb,var(--violet) 8%,var(--surface))}
.pick input{width:20px;height:20px;accent-color:var(--violet);flex:none}
.pick .t{flex:1;min-width:0}
.sub{display:flex;align-items:center;gap:7px;font-size:.72rem;font-weight:750;letter-spacing:.12em;text-transform:uppercase;color:var(--c);padding:8px 2px 0}
.sub .ai{width:1.25em;height:1.25em}

/* ---------- Greeting + hero (sticky character bar) ---------- */
.greet{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.greet h1{font-size:2.65rem}
.mc-sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;padding-block:10px;margin-block:-10px;background:linear-gradient(var(--bg) 72%,transparent)}
.mcard{display:flex;flex-direction:column;gap:12px;width:100%;text-align:left;border:0;color:var(--fg);padding:16px;border-radius:var(--r-xl);position:relative;isolation:isolate;
  background:radial-gradient(120% 90% at 0% 0%,rgba(228,20,168,.32),transparent 55%),radial-gradient(90% 80% at 100% 100%,rgba(10,166,250,.18),transparent 60%),var(--surface);
  box-shadow:inset 0 0 0 1px rgba(228,20,168,.18),0 24px 50px -24px rgba(0,0,0,.8);transition:padding .25s, transform .15s}
.mcard:hover{transform:translateY(-1px)}
.hero-top{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.hero-id{display:flex;flex-direction:column;gap:5px;min-width:0}
.hero-name{font-weight:800;font-stretch:80%;font-size:1.45rem;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-rank{display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:650;color:var(--muted);white-space:nowrap}
.hero-rank .rk{color:var(--rk);font-weight:750}
.hero-xp{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.hero-xp .num{font-size:1.9rem}
.hero-xp small{font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hero-prog{display:flex;flex-direction:column;gap:6px}
.hero-bar{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
.hero-bar i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--grad);box-shadow:0 0 14px rgba(228,20,168,.6);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.hero-sub{display:flex;justify-content:space-between;gap:10px;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.mc-attrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(48px,1fr));gap:6px}
.mc-a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px 7px;border-radius:14px;background:rgba(255,255,255,.035);position:relative;transition:opacity .3s, background .3s}
.mc-ic{color:var(--c);line-height:0}
.mc-ic .ai{width:20px;height:20px}
.mc-a b{font-weight:800;font-stretch:75%;font-size:1.15rem;line-height:1;display:inline-block}
.mc-bar{display:block;width:70%;height:3px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.mc-bar i{display:block;height:100%;background:var(--c);transition:width .55s cubic-bezier(.2,.8,.2,1)}
/* compact state once scrolled */
.mc-sticky.compact .mcard{padding:10px 12px;gap:8px;border-radius:20px}
.mc-sticky.compact .ava{--s:40px!important}
.mc-sticky.compact .hero-name{font-size:1.1rem}
.mc-sticky.compact .hero-xp .num{font-size:1.3rem}
.mc-sticky.compact .hero-xp small,.mc-sticky.compact .hero-sub{display:none}
.mc-sticky.compact .hero-bar{height:5px}
.mc-sticky.compact .mc-a{flex-direction:row;justify-content:center;padding:5px 4px;gap:4px}
.mc-sticky.compact .mc-ic .ai{width:15px;height:15px}
.mc-sticky.compact .mc-a b{font-size:.98rem}
.mc-sticky.compact .mc-bar{display:none}

/* avatar with level ring */
.ava{--s:56px;--p:0;position:relative;width:var(--s);height:var(--s);flex:none;display:block}
.ava-ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--violet-2) 0,var(--blue) calc(var(--p)*1%),rgba(255,255,255,.09) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px))}
.ava-img{position:absolute;inset:6px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:linear-gradient(140deg,#5A1A6A,#122440)}
.ava-img img{width:100%;height:100%;object-fit:cover;display:block}
.ava-ini{font-weight:800;font-stretch:75%;font-size:calc(var(--s)*.34);line-height:1;color:#fff}
.ava-lv{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);min-width:26px;padding:3px 6px 2px;border-radius:999px;background:var(--grad);color:#fff;font-weight:800;font-stretch:75%;font-size:.78rem;line-height:1;text-align:center;box-shadow:0 0 0 3px var(--surface)}

/* XP-gain animation */
.mcard.gaining .mc-a:not(.hit){opacity:.3}
.mc-a.hit{background:color-mix(in srgb,var(--c) 16%,transparent)}
.mc-a.gain b{animation:gainpop .7s ease}
b.bump,.bump{animation:gainpop .8s ease}
@keyframes gainpop{0%{transform:scale(1)}35%{transform:scale(1.45);text-shadow:0 0 12px var(--c,var(--violet-2)),0 0 26px var(--c,var(--violet-2))}100%{transform:none}}
.mc-plus{position:absolute;left:50%;bottom:100%;font-weight:800;font-stretch:75%;font-size:1rem;color:var(--c);text-shadow:0 0 10px var(--c);white-space:nowrap;pointer-events:none;animation:plusup 1.35s ease-out forwards;z-index:2}
@keyframes plusup{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-20px)}}
.orb{position:fixed;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c),0 0 22px var(--c);z-index:65;pointer-events:none}
.mc-hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;width:min(528px,calc(100% - 32px));z-index:55;pointer-events:none;transform:translate(-50%,-150%);transition:transform .38s cubic-bezier(.2,.9,.3,1.12)}
.mc-hud.in{transform:translate(-50%,0)}

/* ---------- Today panel ---------- */
.today{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.ring{width:84px;height:84px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.07)}
.ring .fg{transition:stroke-dasharray 1s cubic-bezier(.2,.8,.2,1)}
.ring-c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring-c .num{font-size:1.9rem}
.ring-c small{display:block;font-size:.68rem;color:var(--muted);font-weight:650;margin-top:2px}
.td-info{display:flex;flex-direction:column;gap:5px;min-width:0}
.streak{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 12px;border-radius:18px;background:linear-gradient(160deg,rgba(254,193,31,.16),rgba(254,193,31,.04));box-shadow:inset 0 0 0 1px rgba(254,193,31,.22)}
.streak svg{width:22px;height:22px;stroke:var(--gold);fill:rgba(254,193,31,.25);stroke-width:1.8;stroke-linejoin:round}
.streak.off svg{stroke:var(--dim);fill:none}
.streak .num{font-size:1.7rem;color:var(--gold)}
.streak.off .num{color:var(--muted)}
.streak small{font-size:.64rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.week{grid-column:1/-1;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding-top:14px;border-top:1px solid var(--line)}
.week span{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.68rem;font-weight:650;color:var(--dim)}
.week i{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.05);display:grid;place-items:center}
.week i.on{background:linear-gradient(140deg,var(--emerald),#0180EF);box-shadow:0 0 12px rgba(10,166,250,.35)}
.week i.on::after{content:"";width:9px;height:5px;border-left:2px solid #04223A;border-bottom:2px solid #04223A;transform:rotate(-45deg) translate(1px,-1px)}
.week span.now{color:var(--fg)}
.week span.now i:not(.on){box-shadow:inset 0 0 0 2px var(--violet)}

/* next challenge */
.nc{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:var(--r-xl);
  background:radial-gradient(100% 120% at 100% 0%,rgba(254,193,31,.16),transparent 55%),linear-gradient(150deg,#1E2230,#151C28);box-shadow:inset 0 0 0 1px rgba(254,193,31,.22),var(--shadow)}
.nc::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;border:1px solid rgba(254,193,31,.18);box-shadow:0 0 0 18px rgba(254,193,31,.04),0 0 0 40px rgba(254,193,31,.025)}
.nc h3{font-size:1.25rem;font-weight:780;font-stretch:88%;max-width:28ch}
.nc .xp{color:var(--gold);font-size:1.4rem}
.nc .bar i{background:var(--grad-gold)}
.nc-x{position:relative;z-index:1;width:32px;height:32px;margin:-6px -8px -6px 0;border:0;border-radius:50%;background:transparent;color:var(--muted);display:grid;place-items:center;transition:background .2s,color .2s}
.nc-x:hover{background:rgba(255,255,255,.08);color:var(--fg)}
.nc-x svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}

/* ---------- Quest rows ---------- */
.qlist{display:flex;flex-direction:column;gap:8px}
.quest{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 14px;transition:border-color .2s, background .2s, opacity .3s}
.quest:hover{border-color:var(--line-2)}
.quest .t{min-width:0;display:flex;flex-direction:column;gap:7px}
.quest .t strong{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.quest .meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.check{width:34px;height:34px;border-radius:50%;border:2px solid var(--line-2);background:transparent;display:grid;place-items:center;transition:border-color .2s, background .2s, box-shadow .25s, transform .15s}
.check:hover{border-color:var(--violet-2);box-shadow:0 0 0 5px rgba(228,20,168,.14)}
.check:active{transform:scale(.9)}
.check svg{width:16px;height:16px;stroke:var(--violet-2);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .2s}
.check:hover svg{opacity:1}
.quest.done{opacity:.55}
.quest.done strong{text-decoration:line-through;text-decoration-color:rgba(255,255,255,.3)}
.quest.done .check{background:var(--emerald);border-color:var(--emerald)}
.quest.done .check svg{stroke:#04223A;opacity:1}
.quest.locked{background:transparent;border-style:dashed;opacity:.42}
.quest.locked .check{border-style:dashed;cursor:not-allowed}
.quest.locked .check svg{opacity:1;stroke:var(--dim);stroke-width:2;width:15px;height:15px}
.quest.now{border-color:rgba(228,20,168,.45);background:linear-gradient(90deg,rgba(228,20,168,.10),transparent 60%),var(--surface)}
.quest.ms:not(.locked){box-shadow:inset 3px 0 0 var(--gold)}
.quest.fresh{animation:unlock 1.2s ease}
.quest.out{height:0!important;opacity:0;padding-block:0;margin-top:-8px;border-width:0;overflow:hidden;transform:translateX(24px);transition:height .4s ease, opacity .25s ease, padding .4s ease, margin .4s ease, transform .3s ease}
.alldone{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:var(--r-md);background:rgba(10,166,250,.07);box-shadow:inset 0 0 0 1px rgba(10,166,250,.22);color:#9ED9FF;font-size:.9rem;font-weight:600}
.alldone svg{width:20px;height:20px;flex:none;stroke:var(--emerald);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
@keyframes unlock{0%{transform:scale(.97)}40%{transform:scale(1.015);box-shadow:0 0 30px rgba(228,20,168,.55)}100%{transform:none}}
.qside{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.mini{height:4px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden;flex:1;max-width:160px}
.mini i{display:block;height:100%;background:var(--grad)}
.dots{display:inline-flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.1)}
.dots i.on{background:var(--emerald);box-shadow:0 0 6px rgba(10,166,250,.5)}

/* folds */
.fold{display:flex;flex-direction:column;gap:10px}
.fold-b{display:flex;flex-direction:column;gap:12px}
.fold-top{display:flex;align-items:center;gap:10px}
.fold-top .fold-h{flex:1;min-width:0}
.fold-h{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;background:none;border:0;padding:6px 2px;text-align:left;color:var(--fg)}
.fold-h .fh-t{min-width:0;display:flex;flex-direction:column;gap:4px}
.fold-h .fh-m{font-size:.8rem;white-space:nowrap;color:var(--muted)}
.fh-now{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:9px;height:9px;border-right:2px solid var(--violet-2);border-bottom:2px solid var(--violet-2);transform:rotate(45deg);transition:transform .2s;margin:0 4px 4px}
.fold-h[aria-expanded="false"] .chev{transform:rotate(-45deg);margin-bottom:0}
.gblock{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:var(--r-lg);background:rgba(255,255,255,.02);border:1px solid var(--line)}
.gblock .fold-h{padding:0}
.gblock .fold-h h3{font-size:1.02rem}
.sortbar{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.sortbar .seg{padding:3px}
.sortbar .seg button{padding:7px 11px;font-size:.78rem}
.hist{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px 18px;border-radius:var(--r-md);border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:600}
.hist:hover{color:var(--fg);border-color:var(--line-2)}

/* ---------- Character page ---------- */
.ccard{position:relative;overflow:hidden;isolation:isolate;border-radius:30px;padding:24px 20px 20px;display:flex;flex-direction:column;gap:20px;
  background:radial-gradient(110% 70% at 50% -10%,color-mix(in srgb,var(--rk) 38%,transparent),transparent 60%),linear-gradient(170deg,#1B2230 0%,#141B26 55%,#0F161F 100%);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--rk) 35%,rgba(255,255,255,.08)),0 40px 70px -40px rgba(228,20,168,.6)}
.ccard::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.5;background:repeating-linear-gradient(120deg,rgba(255,255,255,.018) 0 1px,transparent 1px 14px)}
.cc-head{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.cc-ava{position:relative;cursor:pointer;border-radius:50%}
.cc-cam{position:absolute;right:2px;bottom:6px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);box-shadow:0 0 0 3px #18202C;color:var(--fg)}
.cc-cam svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linejoin:round}
.cc-ava:hover .cc-cam{background:var(--violet)}
.cc-name{font-size:2.3rem}
.rank{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:999px;background:color-mix(in srgb,var(--rk) 14%,transparent);color:var(--rk);font-weight:750;font-size:.82rem;letter-spacing:.04em;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--rk) 35%,transparent)}
.rank svg{width:16px;height:16px;fill:currentColor;fill-opacity:.25;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.cc-level{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:16px;border-radius:20px;background:rgba(0,0,0,.22)}
.cc-level .num{font-size:3.6rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:2px}
.cc-level > div:last-child{display:flex;flex-direction:column;gap:7px;min-width:0}
.cc-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cc-stats div{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 4px;border-radius:16px;background:rgba(255,255,255,.035);text-align:center}
.cc-stats .num{font-size:clamp(1.15rem,5.4vw,1.55rem)}
.cc-stats span{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ava.big{--s:118px}
.ava.big .ava-ring{-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5.5px))}
.ava.big .ava-img{inset:10px}
.ava.big .ava-lv{font-size:1rem;padding:5px 10px 4px;bottom:-8px}

/* radar */
.radar{position:relative;width:min(320px,100%);aspect-ratio:1;margin:8px auto 4px}
.radar svg{width:100%;height:100%;display:block;overflow:visible}
.radar .grid{fill:none;stroke:rgba(255,255,255,.08)}
.radar .axis{stroke:rgba(255,255,255,.06)}
.radar .area{fill:url(#rgf);stroke:url(#rgs);stroke-width:2.2;stroke-linejoin:round;transform-origin:150px 150px;animation:radarIn .9s cubic-bezier(.2,.9,.3,1.1)}
@keyframes radarIn{from{transform:scale(.2);opacity:0}}
.rl{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--c);text-align:center}
.rl .ai{width:20px;height:20px}
.rl b{font-weight:800;font-stretch:75%;font-size:1.15rem;color:var(--fg);line-height:1}
.rl small{font-size:.6rem;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}

/* skills list */
.skill{display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.skill:last-child{border-bottom:0;padding-bottom:2px}
.sk-ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);grid-row:span 2}
.sk-ic .ai{width:23px;height:23px}
.sk-nm{display:flex;align-items:baseline;gap:8px;font-weight:700;min-width:0}
.sk-lv{font-size:1.9rem;color:var(--c);text-align:right}
.skill .bar{grid-column:2/-1}
.sk-txt{grid-column:2/-1;display:flex;justify-content:space-between;gap:10px;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.prest{font-size:.64rem;font-weight:800;letter-spacing:.12em;color:var(--gold)}

/* week chart */
.wchart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;padding-top:8px}
.wc{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.wc-v{font-size:.68rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;min-height:1em}
.wc-bar{width:100%;max-width:30px;flex:1;display:flex;align-items:flex-end;border-radius:9px;background:rgba(255,255,255,.04);overflow:hidden}
.wc-bar i{display:block;width:100%;border-radius:9px;background:linear-gradient(180deg,#E414A8,#7E1788)}
.wc.today .wc-bar i{background:var(--grad);box-shadow:0 0 16px rgba(228,20,168,.6)}
.wc.today .wc-v{color:var(--fg)}
.wc-l{font-size:.7rem;font-weight:650;color:var(--dim)}
.wc.today .wc-l{color:var(--fg)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpis div{padding:14px 10px;border-radius:16px;background:rgba(255,255,255,.035);display:flex;flex-direction:column;gap:6px}
.kpis .num{font-size:1.7rem}
.kpis span{font-size:.64rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* awards */
.awards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 12px}
.aw{background:none;border:0;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--fg);border-radius:12px}
.aw-medal{position:relative;width:100%;max-width:100px;aspect-ratio:1}
.aw-medal > svg{display:block;width:100%;height:100%}
.medal{transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.medal.on{filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))}
.medal.off{filter:grayscale(1) brightness(.42)}
.aw:hover .medal.on{transform:rotate(-8deg) scale(1.05)}
.aw-x{position:absolute;right:0;bottom:2px;font-weight:800;font-size:.75rem;line-height:1;padding:4px 7px;border-radius:999px;background:var(--grad-gold);color:#2A1204}
.aw-n{font-weight:700;font-size:.85rem;line-height:1.15}
.aw-m{font-size:.72rem;color:var(--muted)}
.aw-big{width:min(190px,56vw);aspect-ratio:1;perspective:600px}
.aw-big svg{width:100%;height:100%;display:block}
.aw-big.spin svg{animation:medalIn 1.4s cubic-bezier(.2,.9,.25,1) both}
@keyframes medalIn{0%{transform:scale(.3) rotateY(-540deg);opacity:0}60%{opacity:1}100%{transform:none}}

/* goals */
.goal{display:flex;flex-direction:column;gap:12px}
.goal.done{box-shadow:inset 0 0 0 1px rgba(10,166,250,.3),var(--shadow)}
.unlock{display:inline-flex;gap:6px;align-items:center;font-size:.78rem;font-weight:650;color:var(--gold)}
.unlock svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.gpick{display:flex;flex-direction:column;gap:9px;text-align:left;width:100%;padding:16px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);transition:border-color .2s, transform .12s, background .2s}
.gpick:hover:not(:disabled){border-color:rgba(228,20,168,.55);background:var(--surface-2)}
.gpick:active:not(:disabled){transform:scale(.99)}
.gpick:disabled{opacity:.45;cursor:default}
.gp-name{font-size:1.12rem;font-weight:750;line-height:1.2}
.gp-desc{color:var(--muted);font-size:.88rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gp-cta{font-weight:700;font-size:.85rem;color:var(--violet-2);white-space:nowrap}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.quick button{display:flex;align-items:center;gap:10px;text-align:left;padding:14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);font-weight:650;font-size:.9rem}
.quick button:hover{border-color:var(--line-2);background:var(--surface-2)}
.quick svg{width:20px;height:20px;stroke:var(--violet-2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* profile */
.prow{display:flex;align-items:center;gap:16px}
.log{display:flex;flex-direction:column}
.log div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.log div:last-child{border-bottom:0}
.log span:first-child{min-width:0;overflow-wrap:anywhere}

/* nav + fab */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(14,21,30,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);
  padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 0;color:var(--dim);font-size:.7rem;font-weight:650;letter-spacing:.02em;transition:color .2s}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--fg)}
.nav button[aria-current="page"] svg{stroke:var(--violet-2)}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:31;width:60px;height:60px;border-radius:20px;border:0;display:grid;place-items:center;
  background:var(--grad);box-shadow:0 16px 32px -10px rgba(228,20,168,.85),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .15s, box-shadow .2s}
.fab:hover{transform:translateY(-2px);box-shadow:0 20px 38px -10px rgba(228,20,168,1)}
.fab:active{transform:scale(.94)}
.fab svg{width:28px;height:28px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round}

/* sheet */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(5,9,14,.72);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--bg-2);border:1px solid var(--line-2);border-bottom:0;border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:12px max(18px,env(safe-area-inset-right,0px)) calc(26px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .3s cubic-bezier(.2,.9,.3,1)}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 14px}
@keyframes up{from{transform:translateY(50px);opacity:0}}
.tpl{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 13px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line);text-align:left;width:100%;font-size:.9rem}
.tpl:hover{border-color:rgba(228,20,168,.5)}
.qrow{display:grid;gap:8px;padding:14px;background:var(--surface);border-radius:var(--r-md);border:1px solid var(--line)}
.qrow .row > *{flex:1;min-width:110px}
details summary{cursor:pointer;font-weight:700;color:var(--violet-2);list-style-position:inside}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;width:min(520px,calc(100% - 32px));overflow:hidden;
  background:#1E2836;border:1px solid var(--line-2);border-radius:18px;padding:13px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 18px 40px rgba(0,0,0,.55);animation:up .25s ease}
.toast p{flex:1;min-width:0;font-size:.9rem}
.toast button{background:none;border:0;color:var(--violet-2);font-weight:800;font-size:.9rem;padding:4px 2px;white-space:nowrap}
.toast .tbar{position:absolute;left:0;bottom:0;height:2px;background:var(--grad);animation:shrink linear forwards}
@keyframes shrink{from{width:100%}to{width:0}}

/* celebration overlay */
.ov{position:fixed;inset:0;z-index:70;background:radial-gradient(60% 50% at 50% 42%,color-mix(in srgb,var(--oc,var(--violet)) 30%,transparent),transparent 70%),rgba(6,10,15,.9);display:grid;place-items:center;padding:24px;animation:fade .3s}
.ov-box{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;max-width:360px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.ov-eb{font-size:.74rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--c)}
.ov-name{font-weight:800;font-stretch:78%;font-size:2.4rem;line-height:1;color:#fff}
.ov-icon{width:88px;height:88px;border-radius:28px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 50%,transparent),0 0 40px color-mix(in srgb,var(--c) 40%,transparent)}
.ov-icon .ai{width:50px;height:50px;stroke-width:1.6}
.slot{height:8.5rem;overflow:hidden;font-weight:900;font-stretch:68%;font-size:8.5rem;line-height:8.5rem;color:#fff}
.slot.gold{background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.reel{transition:transform 1.3s cubic-bezier(.3,.9,.25,1.05)}
.reel div{height:8.5rem}
.ov .from{font-size:.85rem;font-weight:650;color:var(--muted);letter-spacing:.06em}
.lvring{width:200px;height:200px;border-radius:50%;display:grid;place-items:center;position:relative}
.lvring::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 180deg,#FFD866,#FEC11F,#FA6021,#FFD866);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));animation:spin 6s linear infinite;box-shadow:0 0 50px rgba(254,193,31,.4)}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:80}

.banner{background:rgba(254,193,31,.09);border:1px solid rgba(254,193,31,.25);border-radius:16px;padding:10px 12px 10px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.86rem}
.splash{min-height:80vh;display:grid;place-items:center;font-size:.8rem;font-weight:700;letter-spacing:.2em;color:var(--muted)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== Compact mobile pass: fewer, denser surfaces; one screen for the essentials ===== */
.wrap{padding-block:12px 112px}
.stack{gap:14px}
.home.stack{gap:14px}
h1{font-size:1.85rem}
h2{font-size:1.15rem;font-stretch:88%}
h3{font-size:.98rem}
.pg-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:4px}
.panel{padding:14px;border-radius:20px}
.sec{gap:8px}
.sec-h{padding:0 2px;align-items:center}
.sec-m{font-size:.75rem}
.banner{padding:8px 12px;font-size:.78rem;border-radius:12px}
.empty{padding:18px 14px;font-size:.85rem;gap:10px;border-radius:16px}
.alldone{padding:11px 14px;font-size:.85rem}
.btn.small{padding:8px 12px;font-size:.8rem}
.btn.small svg{width:15px;height:15px}
.seg button{padding:8px 6px;font-size:.8rem}
.more{background:none;border:0;padding:4px 2px;color:var(--violet-2);font-weight:650;font-size:.8rem;text-align:left;align-self:flex-start;display:inline-flex;align-items:center;gap:6px}
.more svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.dim-more{color:var(--muted)}
.dim-more svg{stroke:var(--emerald)}
/* status */
.status{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px;border-radius:22px;
  background:radial-gradient(120% 100% at 0% 0%,rgba(228,20,168,.30),transparent 55%),radial-gradient(80% 80% at 100% 100%,rgba(10,166,250,.16),transparent 60%),var(--surface);box-shadow:inset 0 0 0 1px rgba(228,20,168,.16),0 20px 40px -24px rgba(0,0,0,.8)}
.st-main{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left;color:inherit;min-width:0}
.st-id{display:flex;flex-direction:column;gap:5px;min-width:0}
.st-hi{font-weight:800;font-stretch:80%;font-size:1.32rem;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-lv{font-size:.78rem;font-weight:650;color:var(--muted);white-space:nowrap}
.st-lv b{color:var(--fg)}
.st-today{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:0;color:var(--muted);font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.st-xp{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.st-xp .hero-bar{height:7px}
.mring{position:relative;width:var(--sz);height:var(--sz);display:block}
.mring svg{width:100%;height:100%;transform:rotate(-90deg)}
.mring circle{fill:none;stroke-width:6;stroke-linecap:round}
.mring .bg{stroke:rgba(255,255,255,.08)}
.mring .fg{stroke:var(--emerald);filter:drop-shadow(0 0 4px rgba(10,166,250,.5));transition:stroke-dasharray .8s}
.mring > span{position:absolute;inset:0;display:grid;place-items:center;grid-auto-flow:column;align-content:center;justify-content:center;font-size:.95rem;color:var(--fg)}
.mring b{font-weight:800;font-stretch:75%;font-size:1.15rem}
.mring small{font-size:.7rem;color:var(--muted);font-weight:650}
/* compact task rows */
.qlist.tight{gap:6px}
.quest.crow{padding:9px 12px 9px 10px;gap:11px;border-radius:14px}
.crow .check{width:30px;height:30px}
.cr-t{min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left}
.cr-t strong{font-weight:600;font-size:.9rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr-s{display:flex;align-items:center;gap:5px;font-size:.7rem;color:var(--muted);min-width:0;white-space:nowrap}
.cr-i{line-height:0}
.cr-i .ai{width:14px;height:14px}
.cr-x{overflow:hidden;text-overflow:ellipsis}
.crow .tag svg{width:11px;height:11px}
.crow .xp{font-size:.95rem}
.crow.ms:not(.done){box-shadow:inset 3px 0 0 var(--gold)}
/* development */
.dev{display:flex;flex-direction:column;gap:12px}
.skillstrip{border:0;background:none;padding:0;width:100%;color:inherit;text-align:center}
.skillstrip .mc-a{padding:7px 2px 6px}
.skillstrip.gaining .mc-a:not(.hit){opacity:.3}
.dev-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.78rem}
.dv-streak{display:inline-flex;align-items:center;gap:6px;font-weight:650;color:var(--fg)}
.dv-streak svg{width:18px;height:18px;stroke:var(--gold);fill:rgba(254,193,31,.25);stroke-width:1.8;stroke-linejoin:round}
.dv-streak b{font-weight:800;font-stretch:75%;font-size:1.15rem;color:var(--gold)}
.dv-streak.off svg{stroke:var(--dim);fill:none}
.dv-streak.off b{color:var(--muted)}
.ncrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:9px 8px 9px 12px;border-radius:14px;background:linear-gradient(90deg,rgba(254,193,31,.11),rgba(254,193,31,.03));box-shadow:inset 0 0 0 1px rgba(254,193,31,.2)}
.nc-ic{line-height:0}
.nc-ic svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nc-go{background:none;border:0;padding:0;color:inherit}
.nc-l{font-size:.62rem;font-weight:750;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.xp.gold{color:var(--gold)}
.ncrow .nc-x{margin:0;width:28px;height:28px}
/* quests page */
.quest{padding:11px 12px;gap:12px}
.quest .t{gap:5px}
.quest .t strong{font-size:.92rem}
.check{width:32px;height:32px}
.fold{gap:8px}
.fold-h{padding:2px}
.fold-h h2{font-size:1.15rem}
.gblock{padding:12px;gap:8px;border-radius:18px}
.qfoot{padding:4px 2px;flex-wrap:wrap}
/* character */
.ccard{padding:16px;gap:14px;border-radius:24px}
.cc-row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.cc-id{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.cc-name{font-size:1.6rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rank{padding:4px 10px 4px 7px;font-size:.74rem}
.cc-lv{display:flex;flex-direction:column;align-items:center;gap:2px}
.cc-lv .num{font-size:2.8rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:2px}
.cc-lv small{font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ava.big{--s:84px}
.ava.big .ava-img{inset:8px}
.cc-cam{width:28px;height:28px;right:-2px;bottom:0}
.cc-stats div{padding:10px 4px}
.cc-stats .num{font-size:clamp(1.05rem,4.8vw,1.35rem)}
.radar{width:min(280px,100%)}
.skill{padding:11px 0}
.sk-ic{width:36px;height:36px;border-radius:12px}
.sk-ic .ai{width:20px;height:20px}
.sk-lv{font-size:1.6rem}
.wchart{height:120px}
.kpis div{padding:12px 10px}
.kpis .num{font-size:1.45rem}
.today{gap:14px}
.ring{width:72px;height:72px}
.ring-c .num{font-size:1.6rem}
.week{padding-top:12px}
.week i{width:24px;height:24px}
/* goal cards */
.goal{gap:10px}
/* nav + fab */
.nav{padding-top:6px}
.nav button{font-size:.6rem;gap:3px;padding:4px 0}
.nav button svg{width:23px;height:23px}
.nav-in{grid-template-columns:repeat(5,1fr)}
.fab{width:54px;height:54px;border-radius:18px;bottom:calc(80px + env(safe-area-inset-bottom,0px))}
.fab svg{width:24px;height:24px}
.toast{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
.hudcard{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:20px;background:var(--surface-2);box-shadow:inset 0 0 0 1px rgba(228,20,168,.2),0 18px 40px rgba(0,0,0,.6)}

.banner{flex-wrap:nowrap;padding:7px 12px;white-space:nowrap}
.banner .link{font-size:.78rem}
.addbtn{width:32px;height:32px;border-radius:11px;border:0;display:grid;place-items:center;background:var(--grad);box-shadow:0 8px 18px -8px rgba(228,20,168,.9)}
.addbtn svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round}
.hfoot{padding:0 2px}
.chip{padding:3px 8px 3px 6px;font-size:.7rem}
.quest .qside{gap:2px}
.quest .icon-btn{padding:4px}
.fold-h h2{font-size:1.05rem}
.radar{width:min(250px,100%)}
.quest .qside{flex-direction:row;align-items:center;gap:4px}
.fold-h h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.nc-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ncrow .cr-t strong{font-size:.86rem}
.status{padding:12px 14px;gap:10px}
.quest.crow{padding-block:8px}
.dev{gap:10px;padding:12px 14px}

/* ===== Brand pass: logo colours (neon blue, magenta, orange on deep navy) + condensed uppercase type ===== */
h1,h2,.st-hi,.cc-name,.ov-name,.hero-name{text-transform:uppercase;font-stretch:64%;font-weight:800;letter-spacing:.01em}
h1{font-size:2.15rem}
h2{font-size:1.3rem}
.st-hi{font-size:1.55rem}
.cc-name{font-size:1.9rem}
.fold-h h2{font-size:1.2rem}
.btn.primary,.fab,.addbtn,.ava-lv{background:var(--grad-btn)}
.btn.primary{box-shadow:0 10px 26px -12px rgba(228,20,168,.8)}
.hero-bar i,.bar i,.mini i{box-shadow:0 0 12px rgba(228,20,168,.45)}
.ava-ring{background:conic-gradient(#0AA6FA 0,#E414A8 calc(var(--p)*.55%),#FA6021 calc(var(--p)*1%),rgba(255,255,255,.09) 0)}
.status{background:radial-gradient(110% 100% at 0% 0%,rgba(10,166,250,.16),transparent 55%),radial-gradient(90% 90% at 100% 100%,rgba(228,20,168,.14),transparent 60%),var(--surface);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),0 20px 40px -24px rgba(0,0,0,.8)}
.mring .fg{stroke:url(#mrg);filter:drop-shadow(0 0 4px rgba(250,96,33,.5))}
.wc-bar i{background:linear-gradient(180deg,#E414A8,#7E1788)}
.wc.today .wc-bar i{background:linear-gradient(180deg,#FEC11F,#FA6021 45%,#C62C2A);box-shadow:0 0 16px rgba(250,96,33,.55)}
.week i.on{background:linear-gradient(140deg,#0AA6FA,#0180EF);box-shadow:0 0 12px rgba(10,166,250,.45)}
.quest.done .check{background:#0AA6FA;border-color:#0AA6FA}
.alldone{background:rgba(10,166,250,.08);box-shadow:inset 0 0 0 1px rgba(10,166,250,.25)}
.topbar{display:flex;align-items:center;gap:9px;padding:2px 2px 0}
.topbar .mark{width:22px;height:26px;flex:none;filter:drop-shadow(0 0 6px rgba(228,20,168,.35))}
.topbar .wm{font-weight:800;font-stretch:62%;font-size:1.05rem;letter-spacing:.04em;line-height:1}
.topbar .demo{margin-left:auto;font-size:.72rem;color:var(--muted);display:flex;gap:8px;align-items:center;white-space:nowrap}
.topbar .demo .link{font-size:.72rem}
.topbar .tb-reload{margin-left:auto;margin-right:-4px}
.topbar .demo + .tb-reload{margin-left:4px}
.icon-btn.soft:hover{color:var(--fg);background:rgba(255,255,255,.06)}
.tb-reload.spin svg, #ptr.spin svg{animation:ptr-spin .8s linear infinite}
@keyframes ptr-spin{to{transform:rotate(360deg)}}
#ptr{position:fixed;top:-36px;left:50%;z-index:60;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line-2);box-shadow:0 6px 18px rgba(0,0,0,.35);opacity:0;transform:translate(-50%,0);transition:opacity .15s;pointer-events:none;color:var(--muted)}
#ptr svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#ptr.ready, #ptr.spin{color:var(--fg);border-color:var(--violet-2)}
.ggroup-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.ggroup-h h2{font-size:1.1rem}
.logo{display:block;width:min(240px,62vw);height:auto;margin:0 auto -6px}
.splash img{width:180px;height:auto;animation:fade .6s}
.auth{gap:22px}
.topbar .wm{white-space:nowrap}
.cc-name{white-space:normal;overflow:visible;font-size:clamp(1.4rem,6.5vw,1.9rem);line-height:.95}
.st-hi{font-size:clamp(1.2rem,5.6vw,1.55rem)}
</style>

// XP per step: final milestone 250, big achievements 175, week/day blocks 100, single actions 50.
function stepXp(t, i, n){
  if (i === n-1) return 250;
  if (/^(Absolviere|Erreiche|Halte den|Koche das|Führe dein erstes|Führe ein 15|Gehe alleine|Sprich dort|Melde dich für|Gestalte die restlichen|Schließe die Bestellung)/.test(t)) return 175;
  if (/diese[rn]? Woche|an \d+ (aufeinanderfolgenden )?Tagen|für den Rest|ganzen Monat|zweiten Monat|eine Woche lang/.test(t)) return 100;
  return 50;
}
const tplXp = t => t.steps.reduce((s,x,i)=>s+stepXp(x,i,t.steps.length),0);

async function api(endpoint, body, method = 'POST'){

async function loadPlayer(user){
  const result = await api('progress');

  if (!state){
    const bytes = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(user.email.trim().toLowerCase()));
    const hash = [...new Uint8Array(bytes)].map(x=>x.toString(16).padStart(2,'0')).join('');
    try { const legacy = JSON.parse(ls.get('luy:acct_' + hash.slice(0,40)) || 'null');
      if (legacy?.email?.toLowerCase() === user.email.toLowerCase() && legacy.state) state = legacy.state;
    } catch {}
  }
  const nextState = migrate(state);
  version = result.version;
  if (state && !result.state){
    const saved = await api('progress', {state:nextState, version}, 'PUT');
    version = saved.version;
  }
  ACCT = {id:user.id, email:user.email}; S = nextState; DEMO = false; OB = null; COMM.list = null; COMM.err = '';
  dirty = false; UI.tab = 'home';
}

// Skills run from 0 to 100. Going beyond 100 starts the next prestige tier at level 1.
function gain(a, amt){
  const from = a.level, fromP = a.prestige || 1; a.xp += amt;
  while (a.xp >= need(a.level)){
    a.xp -= need(a.level);
    if (a.level >= 100){ a.level = 1; a.prestige = (a.prestige || 1) + 1; } else a.level++;
  }
  if ((a.prestige || 1) > fromP) return {from, to:a.level, prestige:a.prestige, max:true};
  return a.level > from ? {from, to:a.level} : null;
}
function makeQuest(o){ return {id:uid(), title:o.title, xp:o.xp, attrs:o.attrs, goalId:o.goalId||null, target:Math.max(1, o.target|0||1), count:0, done:false, kind:o.kind||'once', created:Date.now()}; }

  const g = {id:uid(), name:t.name, desc:t.desc, tpl:t.id, seq:true, unlock:t.unlock ? {...t.unlock} : null, done:false, created:Date.now()};
  const qs = t.steps.map((title, i) => { const q = makeQuest({title, attrs:[...t.attrs], xp:stepXp(title, i, t.steps.length), target:1, goalId:g.id}); q.step = i; return q; });
  return {g, qs};
}

const kindOf = q => q.kind || 'once';
const weekCount = q => q.wk === weekKey() ? (q.wc || 0) : 0;
const doneNow = q => kindOf(q) === 'daily' ? q.lastDay === today() : kindOf(q) === 'weekly' ? weekCount(q) >= q.target : q.done;
const isMilestone = q => q.step != null && q.xp >= 175;

/* ================= Confetti ================= */
function confetti(x, y, power=1, gold=false){
  if (REDUCED) return;
  const cv = $('#confetti'); cv.hidden = false;
  const dpr = devicePixelRatio || 1; cv.width = innerWidth*dpr; cv.height = innerHeight*dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr,dpr);
  const cols = gold ? ['#FFD866','#FEC11F','#FA6021','#FFFFFF','#FF4FC4'] : ['#0AA6FA','#E414A8','#FA6021','#FEC11F','#FF4FC4','#FFFFFF'];
  const P = Array.from({length:Math.round(80*power)}, () => {
    const a = -Math.PI/2 + (Math.random()-.5)*Math.PI*1.1, v = 6 + Math.random()*8*power;
    return {x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, w:4+Math.random()*6, h:3+Math.random()*4, r:Math.random()*6, vr:(Math.random()-.5)*.4, c:cols[Math.random()*cols.length|0], life:0};
  });
  const t0 = performance.now();
  (function frame(t){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    let alive = false;
    P.forEach(p => { p.life++; p.vy += .28; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      if (p.y < innerHeight + 20) alive = true;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.max(0, 1 - p.life/140); ctx.fillStyle = p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); });
    if (alive && t - t0 < 3200) requestAnimationFrame(frame); else { ctx.clearRect(0,0,innerWidth,innerHeight); cv.hidden = true; }
  })(t0);
}

function suggestions(){
  const out = [];
  CORE.forEach(c => {
    const v = OB.scores[c.id], beg = QT.filter(q=>q.a===c.id && q.b), adv = QT.filter(q=>q.a===c.id && !q.b);

/* Reload: first save pending changes, then fetch the latest save from the server (e.g. changes from another device). */
let RELOADING = false;
async function reloadState(){
  if (RELOADING) return; RELOADING = true;
  document.querySelectorAll('.tb-reload').forEach(b => b.classList.add('spin'));
  try {
    if (DEMO || !ACCT){ render(); toast('Aktualisiert.'); return; }
    if (dirty && !(await flushSave())) return; // saveNotice already explains the problem
    const result = await api('progress');
    if (result.state){ S = migrate(result.state); version = result.version; }
    COMM.list = null; COMM.err = '';
    FLASH = []; render(); toast('Aktualisiert.');
  } catch (error){ toast(error.message || 'Neu laden fehlgeschlagen.'); }
  finally { RELOADING = false; document.querySelectorAll('.tb-reload').forEach(b => b.classList.remove('spin')); ptrReset(); }
}
/* Pull to refresh: drag the page down from the very top. */
const PTR = {y0:null, dy:0};
function ptrEl(){ let el = $('#ptr'); if (!el){ el = document.createElement('div'); el.id = 'ptr'; el.setAttribute('aria-hidden','true'); el.innerHTML = ICON.reload; document.body.appendChild(el); } return el; }
function ptrReset(){ const el = $('#ptr'); if (el){ el.style.transform = ''; el.style.opacity = ''; el.classList.remove('ready','spin'); } PTR.y0 = null; PTR.dy = 0; }
addEventListener('touchstart', e => {
  if (scrollY > 0 || e.touches.length !== 1 || !S || !S.onboarded || !ACCT && !DEMO || $('#sheet-root').innerHTML || $('#ov-root').innerHTML) return;
  PTR.y0 = e.touches[0].clientY; PTR.dy = 0;
}, {passive:true});
addEventListener('touchmove', e => {
  if (PTR.y0 == null || RELOADING) return;
  PTR.dy = e.touches[0].clientY - PTR.y0;
  if (PTR.dy <= 0 || scrollY > 0){ ptrReset(); return; }
  const d = Math.min(PTR.dy * .5, 90), el = ptrEl();
  el.style.opacity = Math.min(1, d / 50); el.style.transform = `translate(-50%, ${d}px) rotate(${d * 4}deg)`;
  el.classList.toggle('ready', d >= 60);
}, {passive:true});
addEventListener('touchend', () => {
  if (PTR.y0 == null) return;
  if (Math.min(PTR.dy * .5, 90) >= 60 && !RELOADING){ const el = ptrEl(); el.classList.add('spin'); el.style.transform = 'translate(-50%, 60px)'; reloadState(); }
  else ptrReset();
  PTR.y0 = null;
});

function stickyState(){ const el = document.querySelector('.mc-sticky'); if (!el) return; const c = el.classList.contains('compact'); if (!c && scrollY > 220) el.classList.add('compact'); else if (c && scrollY < 60) el.classList.remove('compact'); }
addEventListener('scroll', stickyState, {passive:true});

function questRow(q){

function viewQuests(){

  }
  const tasks = UI.qView !== 'goals';
  let h = `<div class="pg-h"><h1>Quests</h1></div>

  const weeklies = S.quests.filter(q=>kindOf(q)==='weekly').sort((a,b)=>b.created-a.created), dl = daysLeftInWeek();
  h += foldSec('sec-weekly', 'Weekly Challenges', weeklies.length ? `${weeklies.filter(doneNow).length}/${weeklies.length} · ${dl} T.` : '',
    weeklies.length ? listOrDone(weeklies, 'Alle Challenges dieser Woche geschafft. Am Montag starten sie neu.') : `<div class="empty">Herausforderungen für die Woche, zum Beispiel 3× Sport. Start ist jeden Montag.<button class="btn small primary" data-act="new-quest" data-kind="weekly">Weekly Challenge anlegen</button></div>`);
  const qs = S.quests.filter(q=>kindOf(q)==='once' && (!q.done || LINGER.has(q.id)));
  const order = id => { const i = CORE.findIndex(c=>c.id===id); return i < 0 ? 99 : i; };
  const sorter = {attr:(a,b)=>order(a.attrs[0])-order(b.attrs[0]) || b.xp-a.xp, xp:(a,b)=>b.xp-a.xp, new:(a,b)=>b.created-a.created}[UI.qSort];
  const sortedRows = list => {
    list.sort(sorter);
    if (UI.qSort !== 'attr') return `<div class="qlist">${list.map(questRow).join('')}</div>`;
    let cur = null, out = '';
    list.forEach(q => { if (q.attrs[0] !== cur){ cur = q.attrs[0]; const m = meta(cur); out += `<div class="sub" style="--c:${m.color}">${aIcon(cur)}${esc(m.name)}</div>`; } out += questRow(q); });
    return `<div class="qlist">${out}</div>`;
  };
  const goalBlock = (g, list) => {
    const all = S.quests.filter(q=>q.goalId===g.id), doneN = all.filter(q=>q.done).length, closed = UI.folded.has(g.id);
    let inner;
    if (g.seq){
      list.sort((a,b)=>(a.step??999)-(b.step??999));
      const open = UI.expanded.has(g.id), shown = open ? list : list.slice(0, 3), hidden = list.length - shown.length;
      inner = `<div class="qlist">${shown.map(questRow).join('')}</div>` + (hidden > 0 ? `<button class="more" data-act="expand" data-id="${g.id}">${hidden} weitere Schritte zeigen</button>` : (open && list.length > 3 ? `<button class="more" data-act="expand" data-id="${g.id}">Weniger zeigen</button>` : ''));
    } else inner = sortedRows(list);
    const now = g.seq ? list.find(q=>!isLocked(q)) : null;
    return `<div class="gblock" id="g-${g.id}">
      <button class="fold-h" data-act="fold" data-id="${g.id}" aria-expanded="${!closed}"><span class="chev" aria-hidden="true"></span>
        <span class="fh-t"><h3>${esc(g.name)}</h3>${closed && now ? `<span class="fh-now">Jetzt: ${esc(now.title)}</span>` : ''}</span><span class="fh-m tnum">${doneN}/${all.length}</span></button>
      <div class="bar" style="height:4px"><i style="width:${Math.round(doneN/all.length*100)}%"></i></div>${closed ? '' : inner}</div>`;
  };
  const withOpen = gs => gs.map(g=>({g, list:qs.filter(q=>q.goalId===g.id)})).filter(x=>x.list.length);
  // The user's goal groups come first (also when empty), then ungrouped goals split into template and own goals.
  const nGoals = n => `${n} ${n===1?'Ziel':'Ziele'}`, known = new Set(S.groups.map(gr=>gr.id));
  S.groups.forEach(gr => { const blocks = withOpen(S.goals.filter(g=>g.group===gr.id));
    h += foldSec('grp-'+gr.id, gr.name, nGoals(blocks.length), blocks.length ? blocks.map(x=>goalBlock(x.g, x.list)).join('')
      : `<div class="empty" style="padding:14px">Keine offenen Ziele in dieser Gruppe.<button class="btn small ghost" data-act="new-goal" data-group="${gr.id}">${ICON.plus}Ziel anlegen</button></div>`); });
  const loose = S.goals.filter(g=>!g.group || !known.has(g.group));
  const tplGoals = withOpen(loose.filter(g=>g.tpl)), ownGoals = withOpen(loose.filter(g=>!g.tpl));
  const free = qs.filter(q=>!q.goalId || !S.goals.some(g=>g.id===q.goalId));
  if (tplGoals.length || !S.goals.length) h += foldSec('sec-tpl', S.groups.length ? 'Vorlagen ohne Gruppe' : 'Vorlagen', nGoals(tplGoals.length),
    (tplGoals.length ? tplGoals.map(x=>goalBlock(x.g, x.list)).join('') : `<div class="empty">Noch kein Ziel aus den Vorlagen gestartet.<button class="btn small primary" data-act="gtab" data-v="tpl">Ziele entdecken</button></div>`));
  if (ownGoals.length) h += foldSec('sec-own', S.groups.length ? 'Eigene Ziele ohne Gruppe' : 'Eigene Ziele', nGoals(ownGoals.length), ownGoals.map(x=>goalBlock(x.g, x.list)).join(''));
  h += foldSec('sec-free', 'Freie Quests', `${free.length} offen`, (free.length ? sortedRows(free) : `<div class="empty">Noch keine freien Quests. Sie gehören zu keinem Ziel, zum Beispiel eine einmalige Aufgabe, die du erledigen willst.<button class="btn small primary" data-act="new-quest">Freie Quest erstellen</button></div>`));
  const doneOnce = S.quests.filter(q=>kindOf(q)==='once' && q.done).length;
  h += `<div class="spread qfoot"><div class="sortbar"><span>Sortieren</span><div class="seg" role="group" aria-label="Sortierung"><button data-act="qsort" data-v="attr" aria-pressed="${UI.qSort==='attr'}">Skill</button><button data-act="qsort" data-v="xp" aria-pressed="${UI.qSort==='xp'}">XP</button><button data-act="qsort" data-v="new" aria-pressed="${UI.qSort==='new'}">Neu</button></div></div>
    <button class="link" data-act="qfilter" data-v="done">Erledigt (${doneOnce}) ›</button></div>`;
  return h;
}

/* ----- Character ----- */
function radar(){
  const N = CORE.length, R = 100, cx = 150, cy = 150;
  const pt = (i, v) => { const a = -Math.PI/2 + i*2*Math.PI/N; return [cx + Math.cos(a)*R*v, cy + Math.sin(a)*R*v]; };
  const poly = v => CORE.map((_, i) => pt(i, v).map(n=>n.toFixed(1)).join(',')).join(' ');
  const data = CORE.map((c, i) => pt(i, Math.max(.06, S.attrs[c.id].level/100)).map(n=>n.toFixed(1)).join(',')).join(' ');
  const labels = CORE.map((c, i) => { const [x, y] = pt(i, 1.27); return `<span class="rl" style="left:${x/3}%;top:${y/3}%;--c:var(--c-${c.id})">${aIcon(c.id)}<b>${S.attrs[c.id].level}</b><small>${c.abbr}</small></span>`; }).join('');
  return `<div class="radar" role="img" aria-label="Skill-Profil: ${CORE.map(c=>`${c.name} ${S.attrs[c.id].level}`).join(', ')}">
    <svg viewBox="0 0 300 300" aria-hidden="true"><defs>
      <linearGradient id="rgf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E414A8" stop-opacity=".55"/><stop offset="1" stop-color="#0AA6FA" stop-opacity=".25"/></linearGradient>
      <linearGradient id="rgs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF4FC4"/><stop offset="1" stop-color="#0AA6FA"/></linearGradient></defs>
      ${[.25,.5,.75,1].map(v=>`<polygon class="grid" points="${poly(v)}"/>`).join('')}
      ${CORE.map((_, i)=>{ const [x,y] = pt(i,1); return `<line class="axis" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`; }).join('')}
      <polygon class="area" points="${data}"/>
      ${CORE.map((c, i)=>{ const [x,y] = pt(i, Math.max(.06, S.attrs[c.id].level/100)); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" style="fill:var(--c-${c.id})" stroke="#0F161F" stroke-width="2"/>`; }).join('')}
    </svg>${labels}</div>`;
}
function weekChart(){
  const days = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - 6 + i); return {l:WD[d.getDay()], v:S.days[dayKey(d)]?.xp || 0, t:i===6}; });
  const max = Math.max(100, ...days.map(d=>d.v)), sum = days.reduce((s,d)=>s+d.v,0);
  return `<div class="spread"><div><span class="lbl">XP · letzte 7 Tage</span><div class="num" style="font-size:2.2rem;margin-top:6px">${fmt(sum)}</div></div><span class="muted tnum" style="font-size:.82rem">Ø ${fmt(Math.round(sum/7))} pro Tag</span></div>
    <div class="wchart" role="img" aria-label="XP der letzten 7 Tage: ${days.map(d=>`${d.l} ${d.v}`).join(', ')}">${days.map(d=>`<div class="wc ${d.t?'today':''}"><span class="wc-v">${d.v?fmt(d.v):''}</span><div class="wc-bar"><i style="height:${d.v ? Math.max(4, d.v/max*100) : 0}%"></i></div><span class="wc-l">${d.l}</span></div>`).join('')}</div>`;
}

    <div class="st-xp"><div class="hero-bar"><i style="width:${c.pct}%"></i></div><div class="hero-sub"><span>${fmt(c.rem)} / ${fmt(c.need)} XP</span><span>${nr ? `${nr.n} ab Level ${nr.min}` : 'Höchster Rang'}</span></div></div>
    <div class="cc-stats"><div><b class="num">${fmt(S.stats.xp)}</b><span>XP</span></div><div><b class="num">${ovr()}</b><span>Ø Skill</span></div><div><b class="num">${achievements()}</b><span>Erfolge</span></div><div><b class="num" style="color:${st?'var(--gold)':'inherit'}">${st}</b><span>Streak</span></div></div>

  return `${card}
    <section class="panel"><div class="sec-h" style="padding:0 0 2px"><div><h2>Skills</h2><span class="sec-m">Jede Quest trainiert die Skills, denen sie zugeordnet ist</span></div></div>${skills}
      ${S.special.length===0 ? `<p class="muted" style="margin-top:10px;font-size:.8rem">Spezial-Skills wie Ausdauer oder Charisma schaltest du frei, indem du anspruchsvolle Ziele abschließt.</p>`:''}</section>
    <section class="panel"><button class="fold-h" data-act="fold" data-id="sec-radar" aria-expanded="${profOpen}"><span class="chev" aria-hidden="true"></span><span class="fh-t"><h2>Skill-Profil</h2></span><span class="fh-m">Stärkster: ${top.name}</span></button>${profOpen ? radar() : ''}</section>`;

};
const RIM = Array.from({length:48}, (_, i) => { const r = i % 2 ? 46 : 49.5, a = i/48*Math.PI*2 - Math.PI/2; return `${(50+r*Math.cos(a)).toFixed(2)},${(50+r*Math.sin(a)).toFixed(2)}`; }).join(' ');
let MEDAL_N = 0;
function medalSvg(t, on){
  const [a1, a2] = t.attrs, id = 'md' + (++MEDAL_N);
  return `<svg viewBox="0 0 100 100" class="medal ${on?'on':'off'}" aria-hidden="true"><defs>
    <linearGradient id="${id}a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--c-${a1})"/><stop offset=".55" style="stop-color:#fff"/><stop offset="1" style="stop-color:var(--c-${a2})"/></linearGradient>
    <linearGradient id="${id}c" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--c-${a1})"/><stop offset="1" style="stop-color:var(--c-${a2})"/></linearGradient>
    <radialGradient id="${id}b" cx=".35" cy=".28" r=".85"><stop offset="0" style="stop-color:color-mix(in srgb,var(--c-${a1}) 50%,#151C28)"/><stop offset="1" stop-color="#0B1118"/></radialGradient></defs>
    <polygon points="${RIM}" fill="url(#${id}c)"/>
    <circle cx="50" cy="50" r="42.5" fill="none" stroke="url(#${id}a)" stroke-width="1.6" opacity=".9"/>
    <circle cx="50" cy="50" r="39" fill="url(#${id}b)"/>
    <path d="M20 40A31 31 0 0 1 58 19.5" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="2.4" stroke-linecap="round"/>
    <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${AW[t.id].icon}</g></svg>`;
}
function awardState(t){
  const gs = S.goals.filter(g=>g.tpl===t.id), won = gs.filter(g=>g.done).sort((a,b)=>(a.doneAt||0)-(b.doneAt||0));
  const act = gs.find(g=>!g.done);
  let pct = 0, step = 0;
  if (act){ const qs = S.quests.filter(q=>q.goalId===act.id); pct = goalProgress(act).pct; step = qs.filter(q=>q.done).length + 1; }
  const first = won[0], date = first && (first.doneAt || Math.max(0, ...S.quests.filter(q=>q.goalId===first.id).map(q=>q.doneAt||0)) || null);
  return {earned: won.length > 0, count: won.length, date, active: !!act, pct, step};
}
const fmtDate = d => d ? new Date(d).toLocaleDateString('de-DE', {day:'numeric', month:'short', year:'numeric'}) : '';
function awardsSection(){
  // Only earned medals are shown, newest first. No locked placeholders, so nothing feels like a to-do list.
  const list = GT.filter(t=>AW[t.id]).map(t=>({t, st:awardState(t)})).filter(x=>x.st.earned).sort((a,b)=>(b.st.date||0)-(a.st.date||0));
  if (!list.length) return `<section class="stack" style="gap:12px"><h2>Auszeichnungen</h2>
    <div class="empty">Hier sammeln sich deine Medaillen. Du bekommst eine, sobald du ein Ziel aus den Vorlagen abgeschlossen hast. Welche das sind, bestimmst du selbst.</div></section>`;
  return `<section class="stack" style="gap:14px"><div class="sec-h" style="padding:0"><div><h2>Auszeichnungen</h2><span class="sec-m">${list.length} ${list.length===1?'Medaille':'Medaillen'} verdient</span></div></div>
    <div class="awards">${list.map(({t, st}) => `<button class="aw" data-act="award" data-id="${t.id}" aria-label="${esc(AW[t.id].n)}: erhalten">
      <span class="aw-medal">${medalSvg(t, true)}${st.count>1?`<span class="aw-x">×${st.count}</span>`:''}</span>
      <span class="aw-n">${esc(AW[t.id].n)}</span><span class="aw-m tnum">${fmtDate(st.date) || 'Erhalten'}</span></button>`).join('')}</div></section>`;
}
function awardSheet(id){
  const t = GT.find(x=>x.id===id); if (!t) return; const st = awardState(t), a = AW[id];
  const status = `${st.date ? 'Erhalten am ' + fmtDate(st.date) : 'Erhalten'}${st.count>1?` · ${st.count}× verdient`:''}`;
  openSheet(`<div class="stack" style="align-items:center;text-align:center"><div class="spread" style="width:100%"><span class="lbl">Auszeichnung</span><button type="button" class="btn small ghost" data-act="close">Schließen</button></div>

/* ----- Goals ----- */
function goalProgress(g){ const qs = S.quests.filter(q=>q.goalId===g.id); const tot = qs.reduce((s,q)=>s+q.target,0)||1; const done = qs.reduce((s,q)=>s+Math.min(q.count,q.target),0); return {qs, pct:Math.round(done/tot*100)}; }
function goalsBody(){
  const mine = UI.gTab === 'mine';
  const head = `<div class="spread"><div class="seg" style="flex:1" role="group" aria-label="Ziele"><button data-act="gtab" data-v="mine" aria-pressed="${mine}">Meine Ziele</button><button data-act="gtab" data-v="tpl" aria-pressed="${!mine}">Ziele entdecken</button></div><button class="btn small ghost" data-act="new-goal" aria-label="Eigenes Ziel anlegen">${ICON.plus}Ziel</button></div>`;
  const groupBar = `<div class="spread"><span class="muted" style="font-size:.85rem">${S.groups.length ? 'Ordne deine Ziele in Gruppen.' : 'Bündle deine Ziele in Gruppen, z. B. Gesundheit oder Beruf.'}</span><button class="btn small ghost" data-act="new-group">${ICON.plus}Gruppe</button></div>`;
  if (mine){
    if (!S.goals.length && !S.groups.length) return head + groupBar + `<div class="empty"><h3 style="color:var(--fg)">Noch kein Ziel</h3>Ziele bündeln viele Quests zu einem größeren Vorhaben. Starte mit einer Vorlage oder bau dein eigenes.<button class="btn small primary" data-act="gtab" data-v="tpl">Ziele entdecken</button></div>`;
    const sorted = [...S.goals].sort((a,b)=>(a.done-b.done) || b.created-a.created);
    const known = new Set(S.groups.map(gr=>gr.id));
    const groupHead = (title, n, gr) => `<div class="ggroup-h"><h2>${esc(title)}</h2><span class="muted tnum" style="font-size:.8rem">${n} ${n===1?'Ziel':'Ziele'}</span>
      ${gr ? `<span class="row" style="gap:2px;flex-wrap:nowrap;margin-left:auto"><button class="btn small ghost" data-act="new-goal" data-group="${gr.id}" aria-label="Neues Ziel in „${esc(gr.name)}“">${ICON.plus}Ziel</button><button class="icon-btn" data-act="del-group" data-id="${gr.id}" aria-label="Gruppe „${esc(gr.name)}“ löschen">${ICON.trash}</button></span>` : ''}</div>`;
    const sections = S.groups.map(gr => { const list = sorted.filter(g=>g.group===gr.id);
      return groupHead(gr.name, list.length, gr) + (list.length ? list.map(goalCard).join('') : `<div class="empty" style="padding:14px">Noch keine Ziele in dieser Gruppe.</div>`); }).join('');
    const loose = sorted.filter(g=>!g.group || !known.has(g.group));
    return head + groupBar + sections + (loose.length ? (S.groups.length ? groupHead('Ohne Gruppe', loose.length) : '') + loose.map(goalCard).join('') : '');
  }
  const tplCard = t => {
    const has = S.goals.some(g=>g.tpl===t.id && !g.done), open = UI.expanded.has('tpl-'+t.id);
    return `<article class="panel goal"><div class="spread" style="align-items:flex-start"><h3 style="min-width:0">${esc(t.name)}</h3><button class="btn small ${has?'ghost':'primary'}" data-act="add-goal-tpl" data-id="${t.id}" ${has?'disabled':''}>${has?'Aktiv':'Starten'}</button></div>
      <div class="row" style="gap:6px">${t.attrs.map(a=>`<span class="chip" style="--c:var(--c-${a})">${aIcon(a)}${meta(a).name}</span>`).join('')}<span class="muted tnum" style="font-size:.75rem">${t.steps.length} Schritte · ${fmt(tplXp(t))} XP</span></div>
      ${open ? `<p class="muted" style="font-size:.86rem">${esc(t.desc)}</p>${t.unlock?`<span class="unlock">${ICON.lock} Schaltet frei: ${esc(t.unlock.name)}</span>`:''}` : ''}
      <button class="more" data-act="expand" data-id="tpl-${t.id}">${open?'Weniger':'Details'}</button></article>`; };
  // Templates are shown by topic; any template missing from GT_CAT lands under "Weitere Ziele".
  const placed = new Set(GT_CAT.flatMap(c=>c.ids));
  const cats = [...GT_CAT, {name:'Weitere Ziele', ids:GT.filter(t=>!placed.has(t.id)).map(t=>t.id)}];
  return head + communitySection() + cats.map(c => { const list = c.ids.map(id=>GT.find(t=>t.id===id)).filter(Boolean); if (!list.length) return '';

// Turns one of the player's own goals into the public format the server accepts.
function sharePayload(g){
  const qs = S.quests.filter(q=>q.goalId===g.id).sort((a,b)=>(a.created||0)-(b.created||0));
  return {name:g.name, desc:g.desc || '', quests: qs.slice(0,25).map(q => ({title:q.title, attr:q.attrs.find(a=>CORE.some(c=>c.id===a)) || 'disziplin',

}

      <select class="inp" id="gf-a-${i}" data-gf="${i}.attr" aria-label="Skill">${attrOpts(q.attr)}</select>

    <p class="err" id="gf-err" hidden></p>
    <button class="btn primary block">Ziel anlegen</button></form>`);
