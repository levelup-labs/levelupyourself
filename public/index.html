function readAvatar(file){
  if (!file) return;
  if (!/^image\//.test(file.type)){ toast('Bitte wähle eine Bilddatei, zum Beispiel ein JPG oder PNG.'); return; }
  const fr = new FileReader();
  fr.onload = () => { const img = new Image(); img.onload = () => {
    const S2 = 192, cv = document.createElement('canvas'); cv.width = cv.height = S2; const ctx = cv.getContext('2d');
    const m = Math.min(img.width, img.height); ctx.drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, S2, S2);
    const s = snap(); S.avatar = cv.toDataURL('image/jpeg', .85); persist(); render(); toast('Profilbild gespeichert.', s);
  }; img.onerror = () => toast('Das Bild ließ sich nicht öffnen. Versuch ein anderes.'); img.src = fr.result; };
  fr.readAsDataURL(file);
}

function completeQuest(id, rect){
  const q = S.quests.find(x=>x.id===id); if (!q || doneNow(q) || isLocked(q)) return;
  const s = snap(), k = kindOf(q);
  if (k === 'daily'){ q.lastDay = today(); q.count++; }
  else if (k === 'weekly'){ if (q.wk !== weekKey()){ q.wk = weekKey(); q.wc = 0; } q.wc++; q.count++; }
  else { q.count++; if (q.count >= q.target){ q.done = true; q.doneAt = Date.now(); } }
  const share = Math.round(q.xp / q.attrs.length), ups = [], gains = [];
  q.attrs.forEach(aid => { const a = attrObj(aid); if (!a) return;
    const from = a.level, fromPct = attrPct(a);
    const r = gain(a, share);
    if (r?.prestige){ if (r.from < 100) ups.push({type:'level', id:aid, from:r.from, to:100}); ups.push({type:'prestige', id:aid, p:r.prestige}); }
    else if (r) ups.push({type:'level', id:aid, ...r});
    gains.push({id:aid, amt:share, from, to:a.level, up:!!r, fromPct, toPct:attrPct(a)}); });
  const lvBefore = charLvl(S.stats.xp).L;
  S.stats.quests++; S.stats.xp += q.xp;
  const lvAfter = charLvl(S.stats.xp).L; if (lvAfter > lvBefore) ups.push({type:'char', from:lvBefore, to:lvAfter});
  const dk = today(), d = S.days[dk] || (S.days[dk] = {n:0, xp:0}); d.n++; d.xp += q.xp;
  S.stats.best = Math.max(S.stats.best || 0, streak());
  S.log.unshift({t:Date.now(), title:q.title, xp:q.xp}); S.log = S.log.slice(0,40);
  if (q.goalId && q.done){
    const g = S.goals.find(x=>x.id===q.goalId);
    if (g && !g.done){ const gq = S.quests.filter(x=>x.goalId===g.id);
      if (gq.length && gq.every(x=>x.done)){ g.done = true; g.doneAt = Date.now();
        if (g.unlock && !S.special.some(x=>x.id===g.unlock.id)) S.special.push({...g.unlock, level:1, xp:0, prestige:1});
        ups.push({type:'goal', name:g.name, unlock:g.unlock, tpl:g.tpl}); } }
  }
  FLASH = ups.filter(u=>u.type==='level').map(u=>u.id);
  const next = q.done && q.step != null ? S.quests.find(x=>x.goalId===q.goalId && x.step===q.step+1 && !x.done) : null;
  FRESH = next ? next.id : null;
  if (doneNow(q)){ LINGER.add(q.id); setTimeout(() => vanish(q.id), 1500); }
  persist(); render();
  confetti(rect.left + rect.width/2, rect.top + rect.height/2, .8);
  const animMs = playGain(s, gains, rect);
  const left = k === 'weekly' ? ` (${q.wc}/${q.target} diese Woche)` : k === 'once' && !q.done ? ` (${q.count}/${q.target})` : '';
  const goalHit = d.n === S.dailyGoal ? ' · Tagesziel erreicht!' : '';
  toast(`+${q.xp} XP · ${q.title}${left}${next ? ' · Nächster Schritt frei' : ''}${goalHit}`, s);
  if (ups.length) setTimeout(()=>celebrate(ups), REDUCED ? 0 : animMs + 200);
}

function vanish(id){
  LINGER.delete(id);
  const q = S && S.quests.find(x=>x.id===id);
  if (!q || !doneNow(q)) return;            // undone in the meantime: keep the row
  const el = document.querySelector(`.quest[data-q="${id}"]`); if (!el) return;
  if (REDUCED){ render(); return; }
  el.style.height = el.offsetHeight + 'px'; void el.offsetHeight; el.classList.add('out');
  setTimeout(() => {
    const list = el.parentNode, prev = el.previousElementSibling, nxt = el.nextElementSibling;
    el.remove();
    if (prev && prev.classList.contains('sub') && (!nxt || nxt.classList.contains('sub'))) prev.remove();
    if (list && !list.querySelector('.quest')) render();   // section now empty: show its empty or all-done state
  }, 450);
}

/* ----- XP gain animation: orbs fly from the quest into the skills on the character bar ----- */
function countUp(el, from, to, ms){
  if (!el) return; const t0 = performance.now();
  (function f(t){ const p = Math.min(1, (t - t0)/ms), e = 1 - Math.pow(1-p, 3); el.textContent = fmt(Math.round(from + (to-from)*e)); if (p < 1) requestAnimationFrame(f); })(t0);
}
function hudHtml(){
  const c = charLvl(S.stats.xp);
  return `<div class="hudcard"><div class="st-xp"><div class="hero-bar"><i class="hero-fill" style="width:${c.pct}%"></i></div><div class="hero-sub"><span>Level <b class="hero-lv">${c.L}</b> · <b class="mc-n">${fmt(S.stats.xp)}</b> XP</span></div></div>${skillStrip()}</div>`;
}
function playGain(prev, gains, from){
  if (REDUCED || !gains.length) return 0;
  const home = document.querySelector('.home'), strip0 = home && home.querySelector('.skillstrip');
  const r = strip0 && strip0.getBoundingClientRect();
  const visible = r && r.top >= 0 && r.bottom <= innerHeight - 80;
  const pc = charLvl(prev.stats.xp), nc = charLvl(S.stats.xp);
  let root, hud = null;
  if (!visible){
    const cur = S; S = prev; const html = hudHtml(); S = cur;
    hud = document.createElement('div'); hud.className = 'mc-hud'; hud.setAttribute('aria-hidden','true'); hud.innerHTML = html;
    document.body.appendChild(hud); root = hud;
    requestAnimationFrame(()=>requestAnimationFrame(()=>hud.classList.add('in')));
  } else {
    root = home;
    gains.forEach(g => { const el = root.querySelector(`.skillstrip [data-a="${g.id}"]`); if (!el) return;
      el.querySelector('b').textContent = g.from; const bar = el.querySelector('.mc-bar i'); bar.style.transition = 'none'; bar.style.width = g.fromPct + '%'; });
    const n = root.querySelector('.mc-n'); if (n) n.textContent = fmt(prev.stats.xp);
    const lv = root.querySelector('.hero-lv'); if (lv) lv.textContent = pc.L;
    const hf = root.querySelector('.hero-fill'); if (hf){ hf.style.transition = 'none'; hf.style.width = pc.pct + '%'; }
    const ring = root.querySelector('.status .ava'); if (ring) ring.style.setProperty('--p', pc.pct);
  }
  const strip = root.querySelector('.skillstrip');
  strip.classList.add('gaining');
  gains.forEach(g => strip.querySelector(`[data-a="${g.id}"]`)?.classList.add('hit'));
  const start = hud ? 420 : 80, step = 180;
  gains.forEach((g, i) => setTimeout(() => flyOrbs(g, strip, from), start + i*step));
  const total = start + gains.length*step + 650 + 1300;
  setTimeout(() => {
    countUp(root.querySelector('.mc-n'), prev.stats.xp, S.stats.xp, 700);
    const hf = root.querySelector('.hero-fill'), ring = root.querySelector('.status .ava'), lv = root.querySelector('.hero-lv');
    if (hf){ hf.style.transition = '';
      if (nc.L > pc.L){ hf.style.width = '100%'; setTimeout(()=>{ hf.style.transition = 'none'; hf.style.width = '0%'; void hf.offsetWidth; hf.style.transition = ''; hf.style.width = nc.pct + '%'; if (lv){ lv.textContent = nc.L; lv.classList.add('bump'); } }, 600); }
      else hf.style.width = nc.pct + '%'; }
    if (ring) ring.style.setProperty('--p', nc.pct);
  }, total - 1000);
  setTimeout(() => {
    strip.classList.remove('gaining'); strip.querySelectorAll('.hit').forEach(e=>e.classList.remove('hit'));
    if (hud){ hud.classList.remove('in'); setTimeout(()=>hud.remove(), 450); }
  }, total);
  return total;
}

function flyOrbs(g, card, from){
  const el = card.querySelector(`[data-a="${g.id}"]`); if (!el) return;
  const t = el.querySelector('b').getBoundingClientRect();
  const x0 = from.left + from.width/2, y0 = from.top + from.height/2, x1 = t.left + t.width/2, y1 = t.top + t.height/2;
  const color = meta(g.id).color, N = 4;
  for (let k = 0; k < N; k++){
    const o = document.createElement('div'); o.className = 'orb'; o.style.setProperty('--c', color);
    o.style.left = x0 + 'px'; o.style.top = y0 + 'px'; document.body.appendChild(o);
    const dx = x1 - x0, dy = y1 - y0, bend = (k - 1.5) * 38;
    const a = o.animate([
      {transform:'translate(0,0) scale(.6)', opacity:0},
      {transform:`translate(${dx*.35 + bend}px, ${dy*.35 - 40}px) scale(1.25)`, opacity:1, offset:.35},
      {transform:`translate(${dx}px, ${dy}px) scale(.35)`, opacity:.9}
    ], {duration:620 + k*40, delay:k*55, easing:'cubic-bezier(.45,0,.55,1)', fill:'forwards'});
    a.onfinish = () => { o.remove(); if (k === N-1) landGain(g, el); };
  }
}
function landGain(g, el){
  el.classList.remove('gain'); void el.offsetWidth; el.classList.add('gain');
  const plus = document.createElement('span'); plus.className = 'mc-plus'; plus.textContent = `+${g.amt}`; el.appendChild(plus);
  setTimeout(()=>plus.remove(), 1400);
  const bar = el.querySelector('.mc-bar i'), num = el.querySelector('b');
  bar.style.transition = '';
  if (g.up){
    bar.style.width = '100%';
    setTimeout(() => { num.textContent = g.to; num.classList.remove('bump'); void num.offsetWidth; num.classList.add('bump');
      bar.style.transition = 'none'; bar.style.width = '0%'; void bar.offsetWidth; bar.style.transition = ''; bar.style.width = g.toPct + '%'; }, 520);
  } else bar.style.width = g.toPct + '%';
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const f = ACT[b.dataset.act]; if (!f) return;
  if (b.tagName === 'BUTTON' && b.type !== 'submit') e.preventDefault();
  f(b, e);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ if ($('#ov-root').innerHTML) nextCeleb(); else if ($('#sheet-root').innerHTML) closeSheet(); } });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.score){ OB.scores[t.dataset.score] = +t.value; $('#v-'+t.dataset.score).textContent = t.value; $('#s-'+t.dataset.score).textContent = startLevel(+t.value); }
  if (t.dataset.gf && GF){ const [a, b] = t.dataset.gf.split('.'); if (b === undefined) GF[a] = t.value; else GF.quests[+a][b] = (b==='xp'||b==='target') ? Math.max(1, parseInt(t.value)||1) : t.value; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('input[data-avatar]')) return readAvatar(t.files && t.files[0]);
  if (t.id === 'gf-share' && GF) GF.share = t.checked;
  if (t.dataset.pick !== undefined && OB){ const k = +t.dataset.pick; t.checked ? OB.picks.add(k) : OB.picks.delete(k); const fb = document.querySelector('[data-act="ob-finish"]'); if (fb) fb.textContent = obFinishLabel();
    const nb = document.querySelector('[data-act="ob-none"]'); if (nb) nb.textContent = obNoneLabel(); }
  if (t.dataset.gf && GF){ const [a, b] = t.dataset.gf.split('.'); if (b !== undefined) GF.quests[+a][b] = (b==='xp'||b==='target') ? Math.max(1, parseInt(t.value)||1) : t.value; }
});
document.addEventListener('submit', e => {
  const f = e.target.dataset.form; if (!f) return; e.preventDefault();
  if (f === 'auth') return submitAuth();
  if (f === 'ob-name'){ const v = $('#ob-name').value.trim(); if (!v) return $('#ob-name').focus(); OB.name = v; S.name = v; persist(); OB.step = 2; renderOnboard(); return; }
  if (f === 'rename'){ const v = $('#pf-name').value.trim(); if (!v || v === S.name) return; const s = snap(); S.name = v; persist(); render(); toast('Name gespeichert.', s); return; }
  if (f === 'quest'){
    syncQF(); const err = $('#qf-err');
    if (!QF.title.trim()){ err.textContent = 'Gib der Quest einen Titel.'; err.hidden = false; return; }
    if (!QF.attrs.length){ err.textContent = 'Wähle mindestens einen Skill, den die Quest trainiert.'; err.hidden = false; return; }
    const s = snap(), k = QF.kind;
    S.quests.push(makeQuest({title:QF.title.trim(), xp:QF.xp, attrs:QF.attrs, goalId:k==='once' ? (QF.goalId||null) : null, target:k==='daily' ? 1 : QF.target, kind:k}));
    closeSheet(); persist(); render(); toast(k==='daily' ? 'Daily Quest angelegt.' : k==='weekly' ? 'Weekly Challenge angelegt.' : 'Quest angelegt.', s); return;
  }
  if (f === 'group'){
    const name = $('#grp-name').value.trim(), err = $('#grp-err');
    if (!name){ err.textContent = 'Gib der Gruppe einen Namen.'; err.hidden = false; return; }
    const s = snap(), id = ensureGroup(name), g = GRP_GOAL ? S.goals.find(x=>x.id===GRP_GOAL) : null;
    if (g) g.group = id;
    closeSheet(); persist(); UI.gTab = 'mine'; UI.tab = 'quests'; UI.qView = 'goals'; render();
    toast(g ? `„${g.name}“ liegt jetzt in „${groupName(id)}“.` : `Gruppe „${groupName(id)}“ angelegt.`, s); return;
  }
  if (f === 'goal'){
    const err = $('#gf-err'); const qs = GF.quests.filter(q=>q.title.trim());
    if (!GF.name.trim()){ err.textContent = 'Gib dem Ziel einen Namen.'; err.hidden = false; return; }
    if (!qs.length){ err.textContent = 'Ein Ziel braucht mindestens eine Quest mit Titel.'; err.hidden = false; return; }
    const s = snap(); const group = GF.newGroup.trim() ? ensureGroup(GF.newGroup) : (S.groups.some(gr=>gr.id===GF.group) ? GF.group : null);
    const g = {id:uid(), name:GF.name.trim(), desc:GF.desc.trim(), tpl:null, unlock:null, done:false, group, created:Date.now()};
    const share = !!$('#gf-share')?.checked;
    S.goals.push(g); qs.forEach(q => S.quests.push(makeQuest({title:q.title.trim(), xp:q.xp, attrs:[q.attr], target:q.target, goalId:g.id})));
    closeSheet(); persist(); UI.gTab = 'mine'; UI.tab = 'quests'; UI.qView = 'goals'; render(); toast(`Ziel „${g.name}“ mit ${qs.length} Quests angelegt.`, s);
    if (share) shareGoal(g);
  }
});

/* ================= Demo ================= */
function demoState(){
  const s = freshState(); S = s;
  s.name = 'Alex Berger'; s.onboarded = true;
  s.attrs = {geist:{level:47,xp:120,prestige:1}, koerper:{level:38,xp:60,prestige:1}, disziplin:{level:52,xp:200,prestige:1}, kreativ:{level:29,xp:40,prestige:1}, sozial:{level:99,xp:520,prestige:1}};
  const finish = (q, n) => { q.count = q.target; q.done = true; q.doneAt = Date.now() - n*3600000; };
  const med = goalFromTemplate(GT.find(t=>t.id==='meditation')); med.g.done = true; med.g.doneAt = Date.now() - 875*3600000; med.qs.forEach((q,i)=>finish(q, 900-i));
  s.goals.push(med.g); s.quests.push(...med.qs); s.special.push({id:'achtsam',name:'Achtsamkeit',abbr:'ACH',level:7,xp:80,prestige:1});
  const run = goalFromTemplate(GT.find(t=>t.id==='lauf10k')); run.qs.slice(0,5).forEach((q,i)=>finish(q, 50-i)); s.goals.push(run.g); s.quests.push(...run.qs);
  const kochen = goalFromTemplate(GT.find(t=>t.id==='kochen')); kochen.qs.slice(0,2).forEach((q,i)=>finish(q, 20-i)); s.goals.push(kochen.g); s.quests.push(...kochen.qs);
  const dq = (title, attrs, xp, doneToday) => { const q = makeQuest({title, attrs, xp, kind:'daily'}); if (doneToday){ q.lastDay = today(); q.count = 12; } return q; };
  s.quests.push(dq('10 Minuten meditieren', ['geist','disziplin'], 50, true), dq('2 Liter Wasser trinken', ['koerper'], 50, false), dq('20 Seiten lesen', ['geist'], 50, false));
  const wq = (title, attrs, xp, target, wc) => { const q = makeQuest({title, attrs, xp, target, kind:'weekly'}); q.wk = weekKey(); q.wc = wc; q.count = wc; return q; };
  s.quests.push(wq('3× Sport (mind. 30 Minuten)', ['koerper','disziplin'], 100, 3, 2), wq('Einen Freund anrufen', ['sozial'], 100, 1, 0));
  s.quests.push(makeQuest({title:'Einer Person ehrlich danken', xp:50, attrs:['sozial'], target:1}));
  s.quests.push(makeQuest({title:'10 Min. frei skizzieren oder schreiben', xp:50, attrs:['kreativ'], target:5}));
  s.stats = {quests:58, xp:5150, best:12};
  const days = {}; [0,1,2,3,4,5,8,9,10,11].forEach(i => { const d = new Date(); d.setDate(d.getDate()-i); days[dayKey(d)] = {n: i===0 ? 2 : 2 + (i*7)%4, xp: i===0 ? 150 : 150 + (i*53)%260}; });
  s.days = days;
  s.log = [{t:0,title:'10 Minuten meditieren',xp:50},{t:0,title:'3× Sport (mind. 30 Minuten)',xp:100},{t:0,title:'Recherchiere die richtige Lauftechnik',xp:50}];
  return s;
}

/* ================= Boot ================= */
(async function boot(){
  app().innerHTML = '<div class="wrap"><p role="status">Konto und Spielstand werden geladen …</p></div>';
  try {
    const hash = new URLSearchParams(location.hash.slice(1));
    const confirmation = hash.get('confirmation_token');
    AUTH.recoveryToken = hash.get('recovery_token');
    if (confirmation || AUTH.recoveryToken) history.replaceState(null, '', location.pathname + location.search);
    if (confirmation){
      const result = await api('account', {action:'confirm', token:confirmation});
      AUTH.message = result.message; AUTH.tab = 'login';
    } else if (!AUTH.recoveryToken){
      const result = await api('account');
      if (result.user) await loadPlayer(result.user);
    }
  } catch(error){ AUTH.err = error.message; AUTH.tab = 'login'; }
  render();
})();
})();
